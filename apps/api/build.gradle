plugins {
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}

group = 'fontys.sem3'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        // This configuration is used for dependencies that are only needed at compile time, such as annotation processors.
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters provide a set of pre-configured dependencies for common tasks.
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Validation support for input data.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Data JPA for database access, along with the MySQL connector for runtime database interactions.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // JWT libraries for handling JSON Web Tokens, which are often used for authentication.
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // OpenAPI/Swagger for generating API documentation.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    // Lombok for reducing boilerplate code.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Flyway for managing database migrations.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // SendGrid for sending emails.
    implementation 'com.sendgrid:sendgrid-java:4.10.3'

    // Testing dependencies for unit and integration testing.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2' // H2 is an in-memory database for testing purposes.
}

// Test configuration
test {
    useJUnitPlatform() // Configures the test task to use JUnit 5.
    testLogging {
        events "passed", "skipped", "failed" // Logs the results of the tests.
        exceptionFormat = 'full' // Provides full stack traces for exceptions.
    }
    systemProperty 'spring.profiles.active', 'test' // Activates the 'test' profile for Spring.
    finalizedBy jacocoTestReport // Ensures that the JaCoCo report is generated after tests.
    jacoco {
        destinationFile = layout.buildDirectory.file("jacoco/test.exec").get().asFile // Specifies where to store the JaCoCo execution data.
    }
}

// JaCoCo test report configuration
jacocoTestReport {
    dependsOn test // Ensures that tests are run before generating the report.
    reports {
        xml.required = true // Generates an XML report for CI tools.
        csv.required = false // CSV report is not needed.
        html.required = true // Generates an HTML report for easy viewing.
    }
}

// JaCoCo coverage verification configuration
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE' // Applies coverage rules at the bundle level.
            limit {
                counter = 'INSTRUCTION' // Sets a limit for instruction coverage.
                value = 'COVEREDRATIO'
                minimum = 0.80 // Requires at least 80% instruction coverage.
            }
            limit {
                counter = 'BRANCH' // Sets a limit for branch coverage.
                value = 'COVEREDRATIO'
                minimum = 0.80 // Requires at least 80% branch coverage.
            }
        }
        
        rule {
            element = 'CLASS'
            excludes = [
                '*.repository.*',
                '*.domain.*',
                '*.controller.*',
                '*.config.*',
                '*.converter.*',
                '*.exception.*',
                '*.domain.*',
                '*.entity.*',
                '*.mapper.*',
                '*.jpa.*',
                '*LikeMeApplication*',
                '*Application*'
            ]
            limit {
                counter = 'LINE' // Sets a limit for line coverage.
                value = 'COVEREDRATIO'
                minimum = 0.80 // Requires at least 80% line coverage.
            }
            limit {
                counter = 'METHOD' // Sets a limit for method coverage.
                value = 'COVEREDRATIO'
                minimum = 0.80 // Requires at least 80% method coverage.
            }
        }
    }
}
