<!DOCTYPE html>
<html>
<head>
    <title>Client Order Notifications Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="container py-4">
    <div class="row">
        <div class="col-md-6">
            <h2>Authentication</h2>
            <div id="loginSection" class="mb-4">
                <button class="btn btn-success" onclick="login()">Login as Client</button>
                <div id="loginStatus" class="alert alert-secondary mt-2">Not logged in</div>
            </div>

            <h2>Client Connection</h2>
            <div class="mb-3">
                <input type="text" class="form-control" id="clientId" placeholder="Client ID">
            </div>
            <div class="mb-3">
                <button class="btn btn-primary" onclick="connect()" id="connectBtn" disabled>Connect</button>
                <button class="btn btn-danger" onclick="disconnect()" id="disconnectBtn" disabled>Disconnect</button>
            </div>
            <div id="status" class="alert alert-secondary">Not connected</div>
        </div>
        <div class="col-md-6">
            <h2>Order Notifications</h2>
            <div id="notifications"></div>
        </div>
    </div>

    <script>
        let stompClient = null;
        let clientId = null;

        // Move helper functions to the top
        function updateStatus(message, type) {
            const status = document.getElementById('status');
            status.className = `alert alert-${type}`;
            status.textContent = message;
        }

        function showNotification(message) {
            const notification = JSON.parse(message.body);
            const notifications = document.getElementById('notifications');
            const element = document.createElement('div');
            
            element.className = 'alert alert-info mb-2';
            element.innerHTML = `
                <strong>${notification.type}</strong><br>
                ${notification.message}<br>
                <small>${new Date(notification.timestamp).toLocaleString()}</small>
            `;
            
            notifications.insertBefore(element, notifications.firstChild);
        }

        async function login() {
            const loginData = {
                username: 'demo_client',
                password: 'demo1234'
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(loginData)
                });

                if (!response.ok) {
                    throw new Error('Login failed');
                }

                const data = await response.json();
                const decodedToken = parseJwt(data.accessToken);
                
                localStorage.setItem('jwt_token', data.accessToken);
                localStorage.setItem('user_id', decodedToken.userId);
                
                document.getElementById('loginStatus').className = 'alert alert-success mt-2';
                document.getElementById('loginStatus').textContent = 'Logged in successfully';
                document.getElementById('connectBtn').disabled = false;
                
                // Auto-fill and disable the client ID field
                document.getElementById('clientId').value = decodedToken.userId;
                document.getElementById('clientId').disabled = true;
                
            } catch (error) {
                document.getElementById('loginStatus').className = 'alert alert-danger mt-2';
                document.getElementById('loginStatus').textContent = 'Login failed: ' + error.message;
                document.getElementById('connectBtn').disabled = true;
            }
        }

        // Helper function to decode JWT
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function connect() {
            clientId = document.getElementById('clientId').value;
            if (!clientId) {
                updateStatus('Please enter Client ID', 'warning');
                return;
            }

            const token = localStorage.getItem('jwt_token');
            if (!token) {
                updateStatus('Please login first', 'warning');
                return;
            }

            updateStatus('Connecting...', 'info');
            
            const socket = new SockJS('/api/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = console.log;

            const headers = { 'Authorization': `Bearer ${token}` };
            
            stompClient.connect(headers, 
                frame => {
                    stompClient.subscribe('/user/' + clientId + '/client/notifications', showNotification);
                    updateStatus('Connected', 'success');
                    document.getElementById('disconnectBtn').disabled = false;
                    document.getElementById('connectBtn').disabled = true;
                },
                error => {
                    updateStatus('Connection failed: ' + error, 'danger');
                    document.getElementById('disconnectBtn').disabled = true;
                    document.getElementById('connectBtn').disabled = false;
                }
            );
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect();
                updateStatus('Disconnected', 'secondary');
                document.getElementById('disconnectBtn').disabled = true;
                document.getElementById('connectBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
