# Docs
server.servlet.context-path=/api
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs/swagger

# Cors
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-CSRF-TOKEN
cors.allow-credentials=true
cors.max-age=3600

# MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/likeme}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:likeme_mod}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate setting to automatically update the database schema based on the entity classes
spring.jpa.hibernate.ddl-auto=update

# Enable SQL statement logging to the console for debugging purposes
spring.jpa.show-sql=false

# Set Hibernate to flush changes to the database immediately after save or delete operations
spring.jpa.properties.hibernate.flush.mode=COMMIT

# Format SQL statements for better readability in logs
spring.jpa.properties.hibernate.format_sql=false

# Set the logging level for Hibernate SQL statements to DEBUG for detailed output
logging.level.org.hibernate=ERROR

# Reduce application logging levels
logging.level.fontys.sem3.likeme=ERROR
logging.level.fontys.sem3.likeme.business.impl.utils.EmailServiceImpl=INFO
logging.level.org.springframework.security=ERROR
logging.level.org.springframework.web=ERROR

# Simplify logging patterns
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# File Storage Configuration
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sendgrid Configuration (blank key = emails are logged instead of sent)
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:noreply@likeme.local}

# Frontend URL
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# JWT Token config
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=86400000

# # Security Configuration
# spring.security.csrf.cookie.name=XSRF-TOKEN
# spring.security.csrf.cookie.domain=localhost
# spring.security.csrf.cookie.path=/

# # For testing purposes only (disable in production)
# spring.security.csrf.enabled=${CSRF_ENABLED:true}


# WebSocket Configuration
websocket.endpoint=/ws

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
