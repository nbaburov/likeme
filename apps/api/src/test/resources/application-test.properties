
# Docs
server.servlet.context-path=/api
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs/swagger

# Cors
cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:9000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-CSRF-TOKEN
cors.allow-credentials=true
cors.max-age=3600

# MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/likeme}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:likeme_mod}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:likeme}

# Hibernate setting to automatically update the database schema based on the entity classes
spring.jpa.hibernate.ddl-auto=update

# Enable SQL statement logging to the console for debugging purposes
spring.jpa.show-sql=true

# Set Hibernate to flush changes to the database immediately after save or delete operations
spring.jpa.properties.hibernate.flush.mode=COMMIT

# Format SQL statements for better readability in logs
spring.jpa.properties.hibernate.format_sql=true

# Set the logging level for Hibernate SQL statements to DEBUG for detailed output
logging.level.org.hibernate.SQL=DEBUG

# Set the logging level for binding parameters in SQL statements to TRACE for even more detailed output
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# File Storage Configuration
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sendgrid Configuration
sendgrid.api-key=
sendgrid.from-email=noreply@likeme.local

# Frontend URL
app.frontend-url=http://localhost:3000

# JWT Token config
jwt.secret=test-only-secret-not-used-anywhere-else-0123456789
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=86400000

# Security Configuration
spring.security.csrf.cookie.name=XSRF-TOKEN
spring.security.csrf.cookie.domain=localhost
spring.security.csrf.cookie.path=/

# For testing purposes only (disable in production)
spring.security.csrf.enabled=${CSRF_ENABLED:true}

# Security
spring.security.filter.order=10
security.jwt.secret-key=your-secret-key-here
security.jwt.expiration=86400000
security.jwt.refresh-token.expiration=604800000

# File logging
logging.file.name=logs/test.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Allow bean definition overriding for testing purposes
spring.main.allow-bean-definition-overriding=true
